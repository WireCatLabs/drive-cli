name: Pull request validation

# The same full Linux validation as main (WC-CI-5): contracts, generated files and the test matrix fail here,
# before a merge, instead of at the next release.
on:
  pull_request:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      # Windows and macOS only on the release pull request: a platform failure stops it before publishing,
      # without slowing every other pull request.
      platforms: >-
        ${{ startsWith(github.event.pull_request.title, 'chore: release') ||
        startsWith(github.event.pull_request.title, 'chore(release)') }}
