name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
      platforms:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@08d954b245268c7552a2d33a9ed4c78743784e5a # v0.61.2
    with:
      pack: ${{ inputs.pack || false }}
      bun: true
      bun-run: pnpm build && pnpm smoke:bun
      cli: true
      bin: drive
      # Linux only on main; a release, the monthly run and a manual run add Windows and macOS.
      platforms: ${{ inputs.pack || inputs.platforms || github.event_name == 'workflow_dispatch' }}
      platform-run: |
        node dist/bin/drive.js personal --read-only mcp serve --tools --json >/dev/null
        node dist/bin/drive.js commands --json >/dev/null
      checks: |
        pnpm smoke
        pnpm smoke:node
