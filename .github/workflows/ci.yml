name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@4c78a803c460317fd40a38be6d1fb53278087741
    with:
      pack: ${{ inputs.pack || false }}
      bun: true
      bun-run: pnpm build && pnpm smoke:bun
      checks: |
        pnpm generate:check
        pnpm contracts:check
        pnpm contracts:upgrade
        pnpm security:no-leak
        pnpm docs:check
        pnpm smoke
