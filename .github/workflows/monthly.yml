name: Monthly validation

on:
  schedule:
    - cron: "45 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@3339910c2e1a7d7607ceb91127cfec5522a8cd9e # v0.47.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
